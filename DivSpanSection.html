<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Structure Demo</title>
</head>
<body style="font-family: Arial; line-height: 1.6;">

    <!-- Page Header -->
    <div style="background-color: lightblue; padding: 10px;">
        <h1>My Web Page</h1>
        <p>This is a simple page to understand div, section, and span.</p>
    </div>

    <!-- Main Content -->
    <section style="padding: 15px;">
        <h2>About Me</h2>
        <p>
            Hello! My name is 
            <span style="color: blue; font-weight: bold;">Akshai Ramabhadran</span>. 
            I am a Software Engineer and Coding Instructor.
        </p>
    </section>

    <!-- Another Section -->
    <section style="background-color: #f4f4f4; padding: 15px;">
        <h2>Skills</h2>
        <p>
            I work with 
            <span style="color: green;">Java</span>, 
            <span style="color: green;">Python</span>, 
            <span style="color: green;">HTML</span>, 
            <span style="color: green;">CSS</span>, and 
            <span style="color: green;">JavaScript</span>.
        </p>
    </section>

    <!-- Footer -->
    <div style="background-color: lightgray; padding: 10px; text-align: center;">
        <p>© 2026 My Website</p>
    </div>

</body>
</html>
